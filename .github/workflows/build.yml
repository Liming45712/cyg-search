name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布版本标签（留空只打包，例如 v0.7.0）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-15
            rustTargets: aarch64-apple-darwin x86_64-apple-darwin
          - name: windows-x64
            os: windows-2025
            rustTargets: x86_64-pc-windows-msvc

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.rustTargets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: |
          npm test
          npm run build

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build macOS universal app
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --ci --target universal-apple-darwin --bundles app -- --locked

      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/畅易阁角色筛选.app"
          lipo "$app/Contents/MacOS/cyg-finder" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/cyg-search-macos-universal.zip

      - name: Build Windows portable app
        if: runner.os == 'Windows'
        run: npm run bundle:windows -- --ci --target x86_64-pc-windows-msvc -- --locked

      - name: Collect Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/x86_64-pc-windows-msvc/release/cyg-finder.exe" -Destination "artifacts/畅易阁角色筛选.exe"
          Copy-Item -LiteralPath "docs/windows-portable.txt" -Destination "artifacts/使用说明.txt"

      - name: Smoke test Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Start-Process -FilePath (Resolve-Path "artifacts/畅易阁角色筛选.exe") -PassThru
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "Portable app exited during startup: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0) { break }
            }
            if ($app.MainWindowHandle -eq 0) { throw "Portable app did not create a window" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: Upload desktop app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cyg-search-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish this build's desktop apps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh run download "$GITHUB_RUN_ID" --pattern 'cyg-search-*' --dir release-assets
          mac_app="release-assets/cyg-search-macos-universal/cyg-search-macos-universal.zip"
          windows_app="release-assets/cyg-search-windows-x64/畅易阁角色筛选.exe"
          windows_notes="release-assets/cyg-search-windows-x64/使用说明.txt"
          test -s "$mac_app"
          test -s "$windows_app"
          test -s "$windows_notes"
          gh release create "$tag" "$mac_app" "$windows_app" "$windows_notes" \
            --target "$GITHUB_SHA" --title "$tag" --generate-notes --draft
          gh release edit "$tag" --draft=false --latest
